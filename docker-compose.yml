services:
  nimswallah:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimswallah-app
    restart: unless-stopped
    ports:
      - "7865:7865"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7865/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
