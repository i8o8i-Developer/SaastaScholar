# ==============================================================================
# SaastaScholar Production Docker Compose Stack
# 2-Container High-Performance Architecture:
# Container 1: APP (Vite Frontend SPA + Django REST API + In-Container Redis Cache + Nginx Gateway)
# Container 2: DB  (PostgreSQL 16 Relational Database)
# Fully Compatible With Coolify Traefik Reverse Proxy
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Container 2: PostgreSQL 16 Relational Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: saastascholar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saastascholar_db}
      POSTGRES_USER: ${POSTGRES_USER:-saastascholar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SaastaScholarDB@Secured2026!}
      PGPORT: 5432
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saastascholar_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saastascholar_admin} -d ${POSTGRES_DB:-saastascholar_db} -p 5432 || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Container 1: Full-Stack App (Frontend + Backend + In-Container Redis Cache)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://saastascholar.durgaaisolutions.in}
        VITE_SITE_NAME: ${VITE_SITE_NAME:-SaastaScholar}
        VITE_SITE_DOMAIN: ${VITE_SITE_DOMAIN:-saastascholar.durgaaisolutions.in}
        VITE_PORT: ${VITE_PORT:-7865}
        PORT: ${PORT:-7865}
        HOST: ${HOST:-0.0.0.0}
    container_name: saastascholar_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7865:7865"
    env_file:
      - .env
    environment:
      PORT: 7865
      VITE_PORT: 7865
      HOST: 0.0.0.0
      # PostgreSQL Database Connection
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-saastascholar_db}
      POSTGRES_USER: ${POSTGRES_USER:-saastascholar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SaastaScholarDB@Secured2026!}
      DATABASE_URL: postgresql://${POSTGRES_USER:-saastascholar_admin}:${POSTGRES_PASSWORD:-SaastaScholarDB@Secured2026!}@db:5432/${POSTGRES_DB:-saastascholar_db}
      # In-Container Redis Configuration (Local to App Container)
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_URL: redis://127.0.0.1:6379/1
      # Cryptographic & Administrative Keys
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-saastascholar-drm-core-secret-key-2026-prod-9a8f7b6c5d4e3f2a1b}
      DRM_SIGNING_KEY: ${DRM_SIGNING_KEY:-saastascholar-drm-forensic-watermark-key-2026-8f7e6d5c4b3a2}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@saastascholar.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-i8o8i@CoreDSPortalScureAnubhav}
      ADMIN_NAME: ${ADMIN_NAME:-Saasta Scholar Master Administrator}
      ADMIN_PHONE: ${ADMIN_PHONE:-+91 9532112801}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock_saastas}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Transactional Email Dispatch (SMTP)
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-support@saastascholar.in}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-SaastaScholar Support <support@saastascholar.in>}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      # Observability (SigNoz OpenTelemetry APM & Traces)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://176.31.163.114:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-saastascholar-app}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.name=saastascholar-app,deployment.environment=production}
    volumes:
      - media_data:/app/Backend/media
      - drm_vault_data:/app/Backend/drm_vault
    networks:
      - saastascholar_net
    labels:
      - "coolify.managed=true"

networks:
  saastascholar_net:
    driver: bridge

volumes:
  postgres_data:
  media_data:
  drm_vault_data:
