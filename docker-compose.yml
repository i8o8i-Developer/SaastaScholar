# ==============================================================================
# SaastaScholar Production Docker Compose Stack
# Architecture: Single High-Performance Full-Stack Container (Frontend SPA + Django REST API + In-Container Redis)
# Database: External PostgreSQL (Configured via .env / DATABASE_URL)
# Deployment Port: 7865 | Fully Compatible With Coolify & Traefik Reverse Proxy
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Full-Stack Application (Frontend SPA + Django REST API + In-Container Redis)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://saastascholar.durgaaisolutions.in}
        VITE_SITE_NAME: ${VITE_SITE_NAME:-SaastaScholar}
        VITE_SITE_DOMAIN: ${VITE_SITE_DOMAIN:-saastascholar.durgaaisolutions.in}
        VITE_PORT: ${VITE_PORT:-7865}
        PORT: ${PORT:-7865}
        HOST: ${HOST:-0.0.0.0}
    container_name: saastascholar_app
    restart: unless-stopped
    ports:
      - "${PORT:-7865}:7865"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-7865}
      VITE_PORT: ${VITE_PORT:-7865}
      HOST: 0.0.0.0
      # External PostgreSQL Database Configuration (Passed From .env)
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-}
      # In-Container High-Speed Redis Configuration (127.0.0.1:6379)
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_URL: redis://127.0.0.1:6379/1
      # Cryptographic Security & Master Admin Provisioning
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-saastascholar-drm-core-secret-key-2026-prod-9a8f7b6c5d4e3f2a1b}
      DRM_SIGNING_KEY: ${DRM_SIGNING_KEY:-saastascholar-drm-forensic-watermark-key-2026-8f7e6d5c4b3a2}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@saastascholar.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-i8o8i@CoreDSPortalScureAnubhav}
      ADMIN_NAME: ${ADMIN_NAME:-Saasta Scholar Master Administrator}
      ADMIN_PHONE: ${ADMIN_PHONE:-+91 9532112801}
      # Razorpay Payment Gateway Configuration
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock_saastas}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Transactional Email Dispatch (SMTP)
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-support@saastascholar.in}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-SaastaScholar Support <support@saastascholar.in>}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      # Observability (SigNoz OpenTelemetry APM & Tracing)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://176.31.163.114:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-saastascholar-app}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.name=saastascholar-app,deployment.environment=production}
    volumes:
      - media_data:/app/Backend/media
      - drm_vault_data:/app/Backend/drm_vault
    networks:
      - coolify
    labels:
      - "coolify.managed=true"

networks:
  coolify:
    name: coolify
    external: true

volumes:
  media_data:
  drm_vault_data:
