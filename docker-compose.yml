services:
  nimswallah:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://nimswallah.durgaaisolutions.in}
        VITE_SITE_NAME: ${VITE_SITE_NAME:-NimsWallah}
        VITE_SITE_DOMAIN: ${VITE_SITE_DOMAIN:-nimswallah.durgaaisolutions.in}
        VITE_PORT: ${VITE_PORT:-7865}
        PORT: ${PORT:-7865}
        HOST: ${HOST:-0.0.0.0}
    container_name: nimswallah-app
    restart: unless-stopped
    ports:
      - "7865:7865"
    networks:
      - coolify
      - default
    environment:
      - PORT=7865
      - VITE_PORT=7865
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nimswallah.rule=Host(`nimswallah.durgaaisolutions.in`)"
      - "traefik.http.routers.nimswallah.entrypoints=http,https"
      - "traefik.http.services.nimswallah.loadbalancer.server.port=7865"
      - "coolify.managed=true"
      - "coolify.port=7865"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7865/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  coolify:
    external: true
  default:
    driver: bridge
