# ==============================================================================
# SaastaScholar High-Performance Production Nginx Configuration
# Reverse Proxy Gateway & Static SPA Engine (Nginx 1.26+ Alpine)
# Integrated With SigNoz JSON Telemetry & OpenTelemetry Observability
# ==============================================================================

# SaastaScholar Structured JSON Logging For SigNoz & OpenTelemetry ClickHouse Ingestion
log_format saastascholar_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"service_name":"saastascholar-gateway",'
    '"app_environment":"production"'
'}';

upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 7865 default_server;
    listen 80;
    listen [::]:7865 default_server;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SigNoz-Ready Telemetry Access & Error Logs
    access_log /var/log/nginx/saastascholar_access.log saastascholar_json;
    access_log /var/log/nginx/access.log saastascholar_json;
    error_log /var/log/nginx/saastascholar_error.log warn;

    # Gzip Dynamic & Static Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;

    server_tokens off;

    # Buffer Overflow & Attack Defenses & Large File Uploads (500MB)
    client_body_buffer_size 1M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_max_body_size 500M;

    # Security & Cybersecurity Hardening Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=()" always;

    # Block Insecure HTTP Methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # Block Access To Hidden Dotfiles & Sensitive Configs
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable ETags & If-Modified-Since To Force Fresh HTML Delivery
    etag off;
    if_modified_since off;

    # HTML files must never be cached by browsers
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Single Page Application (SPA) Fallback & Dynamic Routing (Strict Zero-Cache For Root/HTML)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Cache Hashed Static Assets In /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Root Assets (Favicons, Logos, Robots.txt, Sitemap.xml, LLMS.txt)
    location ~* \.(?:ico|png|svg|webp|txt|xml|json)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        access_log off;
    }

    # Proxy API Requests To Django Backend (Compatible with Monolith & Multi-Container)
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Proxy Django Administration Requests
    location /django-admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Django Static Files
    location ^~ /django-static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploaded Academic Media Files
    location ^~ /media/ {
        alias /app/Backend/media/;
        expires 30d;
        access_log off;
    }

    # Health Check Endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
