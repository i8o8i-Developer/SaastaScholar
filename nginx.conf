server {
    listen 7865 default_server;
    listen 80;
    listen [::]:7865 default_server;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Single Page Application (SPA) Fallback & HTML (No Cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache Hashed Static Assets in /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Root Assets (Favicons, Logos, Robots.txt)
    location ~* \.(?:ico|png|svg|webp|txt)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        access_log off;
    }

    # Health Check
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
