server {
    listen 7865 default_server;
    listen 80;
    listen [::]:7865 default_server;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;

    server_tokens off;

    # Buffer Overflow & Slowloris Attack Defenses & Large File Uploads
    client_body_buffer_size 1M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_max_body_size 500M;

    # Security & Cybersecurity Hardening Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Block Insecure HTTP Methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # Block Access To Hidden Dotfiles & Sensitive Configs
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Single Page Application (SPA) Fallback & HTML (No Cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache Hashed Static Assets In /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public Root Assets (Favicons, Logos, Robots.txt)
    location ~* \.(?:ico|png|svg|webp|txt)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        access_log off;
    }

    # Proxy API & Django Admin Requests To Django Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Files
    location ^~ /django-static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploaded Academic Media Files
    location ^~ /media/ {
        alias /app/Backend/media/;
        expires 30d;
        access_log off;
    }

    # Health Check
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
