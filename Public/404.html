<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Study Material Not Found | NimsWallah</title>
  <meta name="description" content="The Requested Notes, Syllabus, Or Question Paper Could Not Be Found. Return Safely To The NimsWallah Academic Portal.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/webp" href="/Favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #040806;
      --bg-card: rgba(8, 22, 16, 0.85);
      --border-subtle: rgba(16, 185, 129, 0.18);
      --border-active: rgba(16, 185, 129, 0.35);
      --text-main: #f0fdf4;
      --text-muted: #94a3b8;
      --emerald-dark: #047857;
      --emerald-main: #059669;
      --emerald-light: #10b981;
      --emerald-glow: rgba(5, 150, 105, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 65%),
        linear-gradient(to right, rgba(16, 185, 129, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    .glow-orb {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(5, 150, 105, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
    }
    .glow-orb-top { top: -120px; left: 50%; transform: translateX(-50%); }

    .card-container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 35px var(--emerald-glow);
      transition: border-color 0.3s ease;
    }
    .card-container:hover {
      border-color: var(--border-active);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 9999px;
      padding: 0.4rem 1rem;
      margin-bottom: 2rem;
    }
    .ping-dot {
      width: 8px;
      height: 8px;
      background-color: var(--emerald-light);
      border-radius: 50%;
      position: relative;
    }
    .ping-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background-color: var(--emerald-light);
      opacity: 0.5;
      animation: ping-pulse 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping-pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .hud-graphic {
      width: 130px;
      height: 130px;
      margin: 0 auto 1.75rem auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hud-svg {
      width: 100%;
      height: 100%;
      animation: hud-rotate 40s linear infinite;
    }
    @keyframes hud-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .hud-center-code {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: clamp(1.85rem, 4.5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.85rem;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 40%, #a7f3d0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead-description {
      color: var(--text-muted);
      font-size: 0.975rem;
      line-height: 1.65;
      margin-bottom: 2.25rem;
      font-weight: 400;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.85rem;
      margin-bottom: 2.5rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--emerald-main) 0%, var(--emerald-dark) 100%);
      color: #ffffff;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.85rem 1.85rem;
      border-radius: 12px;
      border: 1px solid rgba(52, 211, 153, 0.25);
      text-decoration: none;
      box-shadow: 0 8px 20px -4px var(--emerald-glow);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--emerald-light) 0%, var(--emerald-main) 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px rgba(5, 150, 105, 0.4);
    }
    .btn-primary svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }
    .btn-primary:hover svg {
      transform: translateX(-3px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
      font-size: 0.9375rem;
      font-weight: 500;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .system-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.02em;
    }
    .system-footer strong {
      color: #a7f3d0;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .card-container { padding: 2.5rem 1.5rem; }
      .action-group { flex-direction: column; }
      .btn-primary, .btn-secondary { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="glow-orb glow-orb-top"></div>

  <div class="card-container">
    <div class="status-badge">
      <span class="ping-dot"></span>
      <span>NimsWallah • Route Error 404</span>
    </div>

    <div class="hud-graphic">
      <svg class="hud-svg" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" />
        <circle cx="50" cy="50" r="40" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5" stroke-dasharray="6 4" />
        <circle cx="50" cy="50" r="32" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
        <line x1="50" y1="2" x2="50" y2="10" stroke="rgba(52, 211, 153, 0.6)" stroke-width="2" stroke-linecap="round" />
        <line x1="50" y1="90" x2="50" y2="98" stroke="rgba(52, 211, 153, 0.6)" stroke-width="2" stroke-linecap="round" />
        <line x1="2" y1="50" x2="10" y2="50" stroke="rgba(52, 211, 153, 0.6)" stroke-width="2" stroke-linecap="round" />
        <line x1="90" y1="50" x2="98" y2="50" stroke="rgba(52, 211, 153, 0.6)" stroke-width="2" stroke-linecap="round" />
      </svg>
      <div class="hud-center-code">404</div>
    </div>

    <h1>Study Material Not Found</h1>
    <p class="lead-description">
      The Page Or Academic Material You Are Looking For Does Not Exist Or Has Been Moved. Please Return To NimsWallah Home To Continue Browsing.
    </p>

    <div class="action-group">
      <a href="/" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return To NimsWallah
      </a>
      <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='/'" class="btn-secondary">
        Go Back One Step
      </button>
    </div>

    <div class="system-footer">
      NimsWallah • Powered By <strong>Durgaai Solutions</strong>
    </div>
  </div>
</body>
</html>
